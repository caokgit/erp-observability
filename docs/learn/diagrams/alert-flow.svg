<path d="M310,594 C340.0,594 340.0,594 370,594" fill="none" stroke="#6d28d9" stroke-width="2" marker-end="url(#a6d28d9)"/>
<path d="M310,200 C332.5,200 332.5,715 355,715" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a334155)"/>
<path d="M310,325 C332.5,325 332.5,740 355,740" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a334155)"/>
<text x="730" y="112" font-size="11" fill="#475569" text-anchor="start">every rule&#x27;s query runs on a schedule over its window;</text>
<text x="730" y="126" font-size="11" fill="#475569" text-anchor="start">it fires when the query returns rows (a row per dimension)</text>
<rect x="730" y="140" width="280" height="70" rx="8" fill="#fef9c3" stroke="#a16207" stroke-width="2.5"/>
<text x="740" y="160" font-weight="bold" fill="#a16207" font-size="13">L1 lock waits</text>
<text x="740" y="178" fill="#0f172a">wait &gt; 60 s: 5 min, page</text>
<text x="740" y="194" fill="#0f172a">burst &gt; 40 waiting: 15 min, ticket</text>
<rect x="730" y="230" width="280" height="56" rx="8" fill="#fef9c3" stroke="#a16207" stroke-width="2.5"/>
<text x="740" y="250" font-weight="bold" fill="#a16207" font-size="13">L2 HTTP failures</text>
<text x="740" y="268" fill="#0f172a">5xx &gt;= 25: 5 min, page; 499: ticket</text>
<rect x="730" y="292" width="280" height="50" rx="8" fill="#fef9c3" stroke="#a16207" stroke-width="2.5"/>
<text x="740" y="312" font-weight="bold" fill="#a16207" font-size="13">L7 crash loop or OOM</text>
<text x="740" y="330" fill="#0f172a">15 min, page</text>
<rect x="730" y="356" width="280" height="76" rx="8" fill="#fef9c3" stroke="#a16207" stroke-width="2.5"/>
<text x="740" y="376" font-weight="bold" fill="#a16207" font-size="13">L3 tunnel down, L4 IKE errors</text>
<text x="740" y="394" fill="#0f172a">L3: down &gt; 5 min, per instance,</text>
<text x="740" y="410" fill="#0f172a">5 min over 2 days, page; L4: ticket</text>
<rect x="730" y="446" width="280" height="86" rx="8" fill="#fef9c3" stroke="#a16207" stroke-width="2.5"/>
<text x="740" y="466" font-weight="bold" fill="#a16207" font-size="13">L5 job queue, L6 late crons</text>
<text x="740" y="484" fill="#0f172a">L5 pending, oldest age: page</text>
<text x="740" y="500" fill="#0f172a">L5 failed, size: ticket</text>
<text x="740" y="516" fill="#0f172a">L6 overdue &gt; 60 min: ticket</text>
<rect x="730" y="546" width="280" height="60" rx="8" fill="#fef9c3" stroke="#a16207" stroke-width="2.5"/>
<text x="740" y="566" font-weight="bold" fill="#a16207" font-size="13">H heartbeat missing</text>
<text x="740" y="584" fill="#0f172a">no row in 30 min (15 min), page</text>
<rect x="730" y="684" width="280" height="86" rx="8" fill="#fef9c3" stroke="#a16207" stroke-width="2.5"/>
<text x="740" y="704" font-weight="bold" fill="#a16207" font-size="13">Metric rules M1 to M5</text>
<text x="740" y="722" fill="#0f172a">restarts, CPU &gt;= 90 %, storage &gt; 85 %,</text>
<text x="740" y="738" fill="#0f172a">server not alive; 1 to 5 min</text>
<text x="740" y="754" fill="#0f172a">(no query: Azure evaluates the series)</text>
