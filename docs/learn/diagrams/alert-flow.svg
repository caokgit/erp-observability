<rect x="0" y="0" width="1500" height="1030" fill="#ffffff"/>
<text x="24" y="34" font-size="20" fill="#0f172a" text-anchor="start" font-weight="bold">Round 1, end to end: where each alert gets its data, how it is checked, how it fires and reaches Teams</text>
<text x="24" y="56" font-size="12" fill="#475569" text-anchor="start">Dashed: what the client already runs (read only). Solid, thick: what the track adds. REAL as built on dev, 2026-11-08; stg uses the same pieces with its own targets.</text>
<text x="30" y="92" font-size="15" fill="#0f172a" text-anchor="start" font-weight="bold">1. Sources</text>
<text x="360" y="92" font-size="15" fill="#0f172a" text-anchor="start" font-weight="bold">2. Stored</text>
<text x="730" y="92" font-size="15" fill="#0f172a" text-anchor="start" font-weight="bold">3. Checked (the rules)</text>
<text x="1040" y="92" font-size="15" fill="#0f172a" text-anchor="start" font-weight="bold">4. Fired</text>
<text x="1270" y="92" font-size="15" fill="#0f172a" text-anchor="start" font-weight="bold">5. Delivered</text>
<rect x="30" y="110" width="280" height="112" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="6 3"/>
<text x="40" y="130" font-weight="bold" fill="#1d4ed8" font-size="13">Postgres servers</text>
<text x="40" y="148" fill="#0f172a">dev server (drills), prd server (stg&#x27;s DB)</text>
<text x="40" y="164" fill="#0f172a">log_lock_waits: &quot;still waiting&quot;,</text>
<text x="40" y="180" fill="#0f172a">&quot;acquired ... after N ms&quot;</text>
<text x="40" y="196" fill="#0f172a">metrics: cpu, storage, is_db_alive</text>
<rect x="30" y="240" width="280" height="100" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5" stroke-dasharray="6 3"/>
<text x="40" y="260" font-weight="bold" fill="#15803d" font-size="13">Odoo container apps (web, cron)</text>
<text x="40" y="278" fill="#0f172a">nginx sidecar: access lines</text>
<text x="40" y="294" fill="#0f172a">container events (ProcessExited, 137)</text>
<text x="40" y="310" fill="#0f172a">metric: RestartCount</text>
<rect x="30" y="358" width="280" height="80" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5" stroke-dasharray="6 3"/>
<text x="40" y="378" font-weight="bold" fill="#c2410c" font-size="13">VPN gateway (to on-prem)</text>
<text x="40" y="396" fill="#0f172a">tunnel state changes</text>
<text x="40" y="412" fill="#0f172a">IKE negotiation log</text>
<rect x="30" y="456" width="280" height="64" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="6 3"/>
<text x="40" y="476" font-weight="bold" fill="#1d4ed8" font-size="13">Odoo database</text>
<text x="40" y="494" fill="#0f172a">tables queue_job, ir_cron</text>
<rect x="30" y="538" width="280" height="112" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="2.5"/>
<text x="40" y="558" font-weight="bold" fill="#6d28d9" font-size="13">SQL job (Container Apps job)</text>
<text x="40" y="576" fill="#0f172a">every 5 min, login obs_monitor (read only)</text>
<text x="40" y="592" fill="#0f172a">queue backlog, failures, size; late crons</text>
<text x="40" y="608" fill="#0f172a">heartbeat row last, only on success</text>
<text x="40" y="624" fill="#0f172a">identity: Metrics Publisher on the DCR</text>
<path d="M170,520 C170.0,520 170.0,538 170,538" fill="none" stroke="#6d28d9" stroke-width="2" marker-end="url(#a6d28d9)"/>
<rect x="355" y="105" width="320" height="560" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="1.5" stroke-dasharray="6 3"/>
<text x="365" y="126" font-size="13" fill="#475569" text-anchor="start" font-weight="bold">Workspace platform-logs</text>
<text x="370" y="228" font-size="11" fill="#475569" text-anchor="start">via diagnostic settings</text>
<rect x="370" y="140" width="290" height="70" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="6 3"/>
<text x="380" y="160" font-weight="bold" fill="#1d4ed8" font-size="13">Postgres log</text>
<text x="380" y="178" fill="#0f172a">PGSQLServerLogs (prd server)</text>
<text x="380" y="194" fill="#0f172a">AzureDiagnostics PostgreSQLLogs (dev)</text>
<rect x="370" y="236" width="290" height="46" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5" stroke-dasharray="6 3"/>
<text x="380" y="256" font-weight="bold" fill="#15803d" font-size="13">ContainerAppConsoleLogs_CL</text>
<rect x="370" y="290" width="290" height="46" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5" stroke-dasharray="6 3"/>
<text x="380" y="310" font-weight="bold" fill="#15803d" font-size="13">ContainerAppSystemLogs_CL</text>
<rect x="370" y="362" width="290" height="66" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5" stroke-dasharray="6 3"/>
<text x="380" y="382" font-weight="bold" fill="#c2410c" font-size="13">AzureDiagnostics (gateway)</text>
<text x="380" y="400" fill="#0f172a">TunnelDiagnosticLog, IKELogs</text>
<rect x="370" y="530" width="290" height="120" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="2.5"/>
<text x="380" y="550" font-weight="bold" fill="#6d28d9" font-size="13">Custom tables (track)</text>
<text x="380" y="568" fill="#0f172a">OdooQueue_CL, OdooCron_CL,</text>
<text x="380" y="584" fill="#0f172a">OdooHeartbeat_CL, through the DCR</text>
<text x="380" y="600" fill="#0f172a">erp-mgmt-obs-sqljob-dcr (Logs</text>
<text x="380" y="616" fill="#0f172a">Ingestion API), about 3 min late</text>
<rect x="355" y="684" width="320" height="86" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 3"/>
<text x="365" y="704" font-weight="bold" fill="#334155" font-size="13">Azure Monitor metrics (platform)</text>
<text x="365" y="722" fill="#0f172a">kept by Azure, no workspace, no KQL:</text>
<text x="365" y="738" fill="#0f172a">cpu_percent, storage_percent,</text>
<text x="365" y="754" fill="#0f172a">is_db_alive, RestartCount</text>
<path d="M310,160 C340.0,160 340.0,175 370,175" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#a1d4ed8)"/>
<path d="M310,270 C340.0,270 340.0,259 370,259" fill="none" stroke="#15803d" stroke-width="2" marker-end="url(#a15803d)"/>
<path d="M310,300 C340.0,300 340.0,313 370,313" fill="none" stroke="#15803d" stroke-width="2" marker-end="url(#a15803d)"/>
