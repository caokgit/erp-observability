<text x="1050" y="470" font-weight="bold" fill="#b91c1c" font-size="13">Action group</text>
<text x="1050" y="488" fill="#0f172a">4: dev-page, dev-ticket,</text>
<text x="1050" y="504" fill="#0f172a">stg-page, stg-ticket</text>
<text x="1050" y="520" fill="#0f172a">sends the common</text>
<text x="1050" y="536" fill="#0f172a">alert schema (JSON)</text>
