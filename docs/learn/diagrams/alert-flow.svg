<text x="1280" y="580" font-weight="bold" fill="#0369a1" font-size="13">Teams channel</text>
<text x="1280" y="598" fill="#0f172a">dev or stg: a card</text>
<text x="1280" y="614" fill="#0f172a">&quot;Fired: obs-dev-...&quot;,</text>
<text x="1280" y="630" fill="#0f172a">later &quot;Resolved: ...&quot;</text>
<path d="M1375,542 C1375.0,542 1375.0,560 1375,560" fill="none" stroke="#0369a1" stroke-width="2" marker-end="url(#a0369a1)"/>
<rect x="24" y="786" width="1452" height="215" rx="10" fill="#fffbeb" stroke="#a16207" stroke-width="1.5"/>
<text x="40" y="810" font-size="15" fill="#a16207" text-anchor="start" font-weight="bold">Follow one alert: the L1 drill on dev, 2026-11-08 (REAL, UTC)</text>
<line x1="150" y1="850" x2="1400" y2="850" stroke="#a16207" stroke-width="3"/>
<circle cx="150" cy="850" r="9" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/>
<text x="150" y="830" font-size="13" fill="#1d4ed8" text-anchor="middle" font-weight="bold">05:34:12</text>
<text x="150" y="882" font-size="12" fill="#0f172a" text-anchor="middle">a read-only session waits</text>
<text x="150" y="899" font-size="12" fill="#0f172a" text-anchor="middle">for an advisory lock</text>
<text x="150" y="916" font-size="12" fill="#0f172a" text-anchor="middle">on the dev database</text>
<circle cx="410" cy="850" r="9" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/>
<text x="410" y="830" font-size="13" fill="#1d4ed8" text-anchor="middle" font-weight="bold">05:35:24</text>
<text x="410" y="882" font-size="12" fill="#0f172a" text-anchor="middle">it gets the lock: the server</text>
<text x="410" y="899" font-size="12" fill="#0f172a" text-anchor="middle">logs &quot;acquired ... after</text>
<text x="410" y="916" font-size="12" fill="#0f172a" text-anchor="middle">72 s&quot; (log_lock_waits)</text>
<circle cx="670" cy="850" r="9" fill="#f8fafc" stroke="#475569" stroke-width="3"/>
<text x="670" y="830" font-size="13" fill="#475569" text-anchor="middle" font-weight="bold">about 2 min</text>
<text x="670" y="882" font-size="12" fill="#0f172a" text-anchor="middle">the diagnostic setting</text>
<text x="670" y="899" font-size="12" fill="#0f172a" text-anchor="middle">ships the line to</text>
<text x="670" y="916" font-size="12" fill="#0f172a" text-anchor="middle">AzureDiagnostics</text>
<circle cx="930" cy="850" r="9" fill="#fef9c3" stroke="#a16207" stroke-width="3"/>
<text x="930" y="830" font-size="13" fill="#a16207" text-anchor="middle" font-weight="bold">05:37:48</text>
<text x="930" y="882" font-size="12" fill="#0f172a" text-anchor="middle">L1-wait&#x27;s 5-min run finds</text>
<text x="930" y="899" font-size="12" fill="#0f172a" text-anchor="middle">a wait over 60 s: one row,</text>
<text x="930" y="916" font-size="12" fill="#0f172a" text-anchor="middle">alert Fired (severity 1)</text>
<circle cx="1190" cy="850" r="9" fill="#e0f2fe" stroke="#0369a1" stroke-width="3"/>
<text x="1190" y="830" font-size="13" fill="#0369a1" text-anchor="middle" font-weight="bold">05:37:50</text>
<text x="1190" y="882" font-size="12" fill="#0f172a" text-anchor="middle">dev-page action group, the</text>
<text x="1190" y="899" font-size="12" fill="#0f172a" text-anchor="middle">Logic App posts the card:</text>
<text x="1190" y="916" font-size="12" fill="#0f172a" text-anchor="middle">it shows in the dev channel</text>
<text x="40" y="960" font-size="12" fill="#475569" text-anchor="start">From the wait&#x27;s end to the card: 2 min 26 s. The other drills: each card 1 to 3 s after its alert; every alert within 8 min of the rules being enabled.</text>
<text x="40" y="980" font-size="12" fill="#475569" text-anchor="start">Not drilled (never caused): L3 tunnel down, L7 crash loop, the restart metric; their queries are proven by the backtests over a year of real history (A3).</text>
</svg>
