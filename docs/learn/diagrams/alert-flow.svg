<rect x="1040" y="300" width="200" height="120" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2.5"/>
<text x="1050" y="320" font-weight="bold" fill="#b91c1c" font-size="13">Alert</text>
<text x="1050" y="338" fill="#0f172a">Fired, then Resolved</text>
