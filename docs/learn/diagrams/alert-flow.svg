<text x="1280" y="470" font-weight="bold" fill="#0369a1" font-size="13">Teams workflow</text>
<text x="1280" y="488" fill="#0f172a">the owner&#x27;s, shared,</text>
<text x="1280" y="504" fill="#0f172a">unchanged: posts the</text>
<text x="1280" y="520" fill="#0f172a">request body as a card</text>
